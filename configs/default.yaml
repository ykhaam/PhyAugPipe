project:
  name: phyaugpipe_panda70m
  seed: 42
  output_root: outputs
  run_name: default_run

io:
  metadata_csv: data/panda70m_metadata.csv
  metadata_id_field: sample_id
  metadata_split_field: split
  metadata_caption_field: caption
  metadata_desirable_field: desirability
  metadata_shot_field: shot_count
  metadata_duration_field: duration_sec
  metadata_video_ref_field: video_path
  local_video_dirs:
    - data/videos

modes:
  metadata_only: true
  smoke_test: false
  smoke_test_n: 10
  overwrite: false

shortlist:
  desirable_only: true
  single_shot_only: true
  sports_dynamics_only: true
  keywords:
    - kick
    - jump
    - throw
    - hit
    - fall
    - collide
    - run
    - bounce
    - spin
  duration_min_sec: 1.0
  duration_max_sec: 30.0
  random_shuffle: true
  random_seed: 42
  max_samples: 30000

frames:
  enabled: true
  strategy: uniform  # uniform | middle
  num_frames: 4
  width: 640
  jpg_quality: 90

pipeline:
  stages:
    - stage1_prefilter
    - stage2_extract_frames
    - stage3_element_parsing
    - stage4_vision_checking
    - stage5_physics_reasoning
    - stage6_scoring
    - stage7_prompt_extending
    - stage8_export

export:
  selection_mode: threshold  # threshold | top_n
  threshold: null
  top_n: 1000
  balanced_by_split: false
  include_rejected: true
